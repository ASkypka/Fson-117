  <div class="backdrop">
    <div class="modal">

      <form class="modal-form">
        <div class="modal-container-block">

          <div class="modal-form-input-cont">
            <input class="modal-form-input" required id="user-text" title="Andrii" pattern="[a-zA-Zа-яА-ЯіІїЇєЄ']+"

            <svg width="24" height="24" class="modal-form-icon">

            </svg>

        </div>
        <div class="modal-container-block">
          <label class="modal-form-label" for="user-email">Email</label>
          <div class="modal-form-input-cont">
            <input class="modal-form-input" required id="user-email" title="test@gmai.com" name="user-email"
              placeholder="test@gmail.com" type="email">
            <svg width="24" height="24" class="modal-form-icon">
              <use href="./images/icons.svg#mail"></use>
            </svg>
          </div>
        </div>
        <div class="modal-container-block">
          <label class="modal-form-label" for="user-tel">Phone number</label>
          <div class="modal-form-input-cont">
            <input class="modal-form-input" required id="user-tel" title="xxx-xxx-xx-xx" name="user-tel"
              placeholder="xxx-xxx-xx-xx" type="tel">
            <svg width="24" height="24" class="modal-form-icon">
              <use href="./images/icons.svg#phone"></use>
            </svg>
          </div>
        </div>
        <div class="cont-user-text">
          <label class="modal-form-label" for="user-coment">Comment</label>
          <textarea name="user-coment" placeholder="Enter text" id="user-coment" class="user-coment"></textarea>

        <div class="modal-form-con-chekbox">
          <input type="checkbox" class="checkbox visually-hidden" id="user-checkbox">
          <label class="label-checkbox" for="user-checkbox"><span class="custom-checkbox">
              <svg width="10" height="10">
                <use href="./images/icons.svg#cheked"></use>
              </svg>
            </span>I accept the terms and conditions of the <a href="">Privacy
              Policy</a></label>
        </div>
        <button type="submit">Send</button>
